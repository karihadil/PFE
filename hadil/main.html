<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFE Calculator</title>
</head>
<body>
    <h2>BMI Calculator</h2>
    <label for="number1">Number 1:</label>
    <input type="number" id="number1" placeholder="Enter number 1">
    <br>
    <label for="number2">Number 2:</label>
    <input type="number" id="number2" placeholder="Enter number 2">
    <br>
    <button onclick="calculateBMI()">Calculate</button>
    
    <h3>Result:</h3>
    <p id="result"></p>
    
    <script>
        async function calculateBMI() {
            const num1 = document.getElementById('number1').value;
            const num2 = document.getElementById('number2').value;
            
            if (num1 < 20 || num1 > 200 || num2 < 20 || num2 > 200) {
                document.getElementById('result').innerText = "Values must be between 20 and 200.";
                return;
            }
            
            const response = await fetch(`http://127.0.0.1:8000/code?number1=${num1}&number2=${num2}`);
            const data = await response.json();
            
            document.getElementById('result').innerText = `BMI: ${data.bmi}, Message: ${data.message}`;
        }
    </script>
</body>
</html>
